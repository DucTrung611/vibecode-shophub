services:
  postgres:
    image: postgres:15-alpine
    container_name: shophub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shophub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shophub}
      POSTGRES_DB: ${DB_NAME:-shophub}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - shophub_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-shophub} -d ${DB_NAME:-shophub}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shophub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-shophub}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - shophub_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-shophub}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: shophub-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      - postgres

volumes:
  shophub_postgres_data:
  shophub_redis_data:
