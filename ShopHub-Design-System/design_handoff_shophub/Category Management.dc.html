<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#EEF0F7;font-family:'Manrope',sans-serif;}
  a{color:#2A3FD1;}
  a:hover{color:#1F30A8;}
</style>
</helmet>

<div style="display:flex;width:1440px;min-height:900px;background:#F7F8FC;">

  <div style="width:236px;flex-shrink:0;background:#0B0F24;padding:20px 16px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:28px;padding:0 6px;">
      <div style="width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#5C79F5,#3A56E8);display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;color:#fff;font-size:15px;">S</div>
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;color:#fff;">ShopHub <span style="font-weight:600;color:#8FA3FF;font-size:11px;">Admin</span></div>
    </div>
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:{{ n.bg }};color:{{ n.color }};font-size:13px;font-weight:700;cursor:pointer;">
        <span style="font-size:15px;">{{ n.icon }}</span>{{ n.label }}
      </div>
    </sc-for>
  </div>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <div style="height:64px;background:#fff;border-bottom:1px solid #DDE1EC;display:flex;align-items:center;justify-content:space-between;padding:0 28px;">
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:18px;color:#14162A;">Quản lý danh mục</div>
      <button onClick="{{ toggleForm }}" style="font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:#fff;background:#3A56E8;border:none;border-radius:9px;padding:10px 18px;cursor:pointer;">+ Thêm danh mục</button>
    </div>

    <div style="flex:1;overflow-y:auto;padding:24px 28px 40px;display:grid;grid-template-columns:{{ gridTemplate }};gap:20px;">

      <div style="background:#fff;border:1px solid #DDE1EC;border-radius:14px;overflow:hidden;">
        <div style="display:grid;grid-template-columns:2.4fr 1fr 1fr 1fr 1fr;padding:12px 20px;background:#F7F8FC;">
          <div style="font-size:11px;font-weight:700;color:#6E7591;">TÊN DANH MỤC</div>
          <div style="font-size:11px;font-weight:700;color:#6E7591;">SẢN PHẨM</div>
          <div style="font-size:11px;font-weight:700;color:#6E7591;">HOA HỒNG</div>
          <div style="font-size:11px;font-weight:700;color:#6E7591;">TRẠNG THÁI</div>
          <div style="font-size:11px;font-weight:700;color:#6E7591;text-align:right;">THAO TÁC</div>
        </div>
        <sc-for list="{{ categories }}" as="c" hint-placeholder-count="10">
          <div style="display:grid;grid-template-columns:2.4fr 1fr 1fr 1fr 1fr;padding:12px 20px;border-top:1px solid #EEF0F7;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding-left:{{ c.indent }}px;">
              <span style="font-size:15px;">{{ c.icon }}</span>
              <span style="font-size:12px;font-weight:{{ c.weight }};color:#14162A;">{{ c.name }}</span>
            </div>
            <div style="font-size:12px;color:#3B4059;">{{ c.products }}</div>
            <div style="font-size:12px;color:#3B4059;">{{ c.commission }}%</div>
            <div>
              <div style="width:34px;height:20px;border-radius:99px;background:{{ c.toggleBg }};position:relative;">
                <div style="width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:{{ c.togglePos }};"></div>
              </div>
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
              <div style="font-size:12px;font-weight:700;color:#2A3FD1;cursor:pointer;">Sửa</div>
              <div style="font-size:12px;font-weight:700;color:#D6293E;cursor:pointer;">Xóa</div>
            </div>
          </div>
        </sc-for>
      </div>

      <sc-if value="{{ showForm }}" hint-placeholder-val="{{ false }}">
        <div style="background:#fff;border:1px solid #DDE1EC;border-radius:14px;padding:20px 24px;height:fit-content;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
            <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:14px;color:#14162A;">Danh mục mới</div>
            <div onClick="{{ toggleForm }}" style="font-size:14px;color:#9AA1B9;cursor:pointer;">✕</div>
          </div>
          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:#3B4059;display:block;margin-bottom:6px;">Tên danh mục</label>
            <div style="padding:9px 12px;border-radius:8px;border:1.5px solid #DDE1EC;font-size:12px;color:#9AA1B9;">VD: Đồ gia dụng thông minh</div>
          </div>
          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:#3B4059;display:block;margin-bottom:6px;">Danh mục cha</label>
            <div style="padding:9px 12px;border-radius:8px;border:1.5px solid #DDE1EC;font-size:12px;color:#3B4059;">Nhà cửa &amp; Đời sống ▾</div>
          </div>
          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:700;color:#3B4059;display:block;margin-bottom:6px;">Biểu tượng</label>
            <div style="display:flex;gap:8px;">
              <div style="width:38px;height:38px;border-radius:8px;background:#EEF1FF;display:flex;align-items:center;justify-content:center;font-size:16px;border:1.5px solid #3A56E8;">🏠</div>
              <div style="width:38px;height:38px;border-radius:8px;background:#F7F8FC;display:flex;align-items:center;justify-content:center;font-size:16px;border:1.5px solid #DDE1EC;">🛋</div>
              <div style="width:38px;height:38px;border-radius:8px;background:#F7F8FC;display:flex;align-items:center;justify-content:center;font-size:16px;border:1.5px solid #DDE1EC;">🔧</div>
            </div>
          </div>
          <div style="margin-bottom:20px;">
            <label style="font-size:12px;font-weight:700;color:#3B4059;display:block;margin-bottom:6px;">Tỷ lệ hoa hồng (%)</label>
            <div style="padding:9px 12px;border-radius:8px;border:1.5px solid #DDE1EC;font-size:12px;color:#14162A;">5.0</div>
          </div>
          <button style="width:100%;box-sizing:border-box;font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:#fff;background:#3A56E8;border:none;border-radius:9px;padding:11px;cursor:pointer;">Lưu danh mục</button>
        </div>
      </sc-if>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { showForm: false };
  toggleForm = () => this.setState(s => ({ showForm: !s.showForm }));

  renderVals() {
    const navItems = [
      { icon: '📊', label: 'Tổng quan', bg: 'transparent', color: '#C3C9DB' },
      { icon: '👥', label: 'Người dùng', bg: 'transparent', color: '#C3C9DB' },
      { icon: '🏪', label: 'Duyệt gian hàng', bg: 'transparent', color: '#C3C9DB' },
      { icon: '📦', label: 'Kiểm duyệt sản phẩm', bg: 'transparent', color: '#C3C9DB' },
      { icon: '🗂', label: 'Danh mục', bg: '#3A56E8', color: '#fff' },
      { icon: '📈', label: 'Báo cáo & phân tích', bg: 'transparent', color: '#C3C9DB' },
    ];
    const raw = [
      { icon: '📱', name: 'Điện tử', products: '48.2k', commission: '4.5', level: 0, active: true },
      { icon: '🎧', name: 'Âm thanh', products: '12.4k', commission: '4.5', level: 1, active: true },
      { icon: '📷', name: 'Máy ảnh & Phụ kiện', products: '6.1k', commission: '5.0', level: 1, active: true },
      { icon: '👗', name: 'Thời trang', products: '86.4k', commission: '6.0', level: 0, active: true },
      { icon: '👕', name: 'Thời trang nam', products: '38.2k', commission: '6.0', level: 1, active: true },
      { icon: '👚', name: 'Thời trang nữ', products: '48.2k', commission: '6.0', level: 1, active: true },
      { icon: '🏠', name: 'Nhà cửa & Đời sống', products: '32.6k', commission: '5.5', level: 0, active: true },
      { icon: '💄', name: 'Làm đẹp', products: '28.1k', commission: '7.0', level: 0, active: true },
      { icon: '🍼', name: 'Mẹ & bé', products: '18.9k', commission: '5.0', level: 0, active: false },
      { icon: '🐾', name: 'Thú cưng', products: '9.4k', commission: '5.0', level: 0, active: true },
    ];
    const categories = raw.map(c => ({
      ...c, indent: c.level * 24, weight: c.level === 0 ? 700 : 600,
      toggleBg: c.active ? '#3A56E8' : '#DDE1EC', togglePos: c.active ? '17px' : '3px',
    }));
    return {
      navItems, categories,
      showForm: this.state.showForm,
      gridTemplate: this.state.showForm ? '1fr 340px' : '1fr',
      toggleForm: this.toggleForm,
    };
  }
}

</script>
</body>
</html>
